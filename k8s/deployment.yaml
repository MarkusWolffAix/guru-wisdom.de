apiVersion: apps/v1
kind: Deployment
metadata:
  name: guru-wisdom
  labels:
    app: guru-wisdom
spec:
  replicas: 1
  selector:
    matchLabels:
      app: guru-wisdom
  template:
    metadata:
      labels:
        app: guru-wisdom
    spec:
      containers:
      - name: web
        image: guru-wisdom:prod
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        env:
        - name: APP_ENV
          value: "prod"
        - name: SERVER_NAME
          value: ":80"
---
apiVersion: v1
kind: Service
metadata:
  name: guru-wisdom-service
spec:
  selector:
    app: guru-wisdom
  ports:
  - port: 80
    targetPort: 80
